<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로또 번호 생성기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #222;
      margin-bottom: 8px;
    }

    p.desc {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    button {
      flex: 1;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    #generateBtn {
      background-color: #2563eb;
      color: #ffffff;
    }

    #generateBtn:hover {
      background-color: #1d4ed8;
    }

    #copyBtn {
      flex: 0.45;
      background-color: #e2e8f0;
      color: #334155;
      display: none;
    }

    #copyBtn:hover {
      background-color: #cbd5e1;
    }

    .result-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lotto-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #f8fafc;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }

    .row-label {
      font-weight: 700;
      color: #64748b;
      font-size: 0.95rem;
      width: 24px;
      text-align: left;
    }

    .balls {
      display: flex;
      gap: 8px;
    }

    .ball {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      box-shadow: inset -2px -2px 4px rgba(0, 0, 0, 0.2);
    }

    .color-1 { background-color: #fbc400; }
    .color-2 { background-color: #69c8f2; }
    .color-3 { background-color: #ff7272; }
    .color-4 { background-color: #aaaaaa; }
    .color-5 { background-color: #b0d840; }

    .empty-msg {
      color: #94a3b8;
      font-size: 0.95rem;
      padding: 30px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍀 로또 6/45 번호 추천</h1>
    <p class="desc">버튼을 누르면 행운의 번호 5게임이 생성됩니다.</p>

    <div class="btn-group">
      <button type="button" id="generateBtn">번호 5개 추천받기</button>
      <button type="button" id="copyBtn">전체 복사</button>
    </div>

    <div id="resultList" class="result-list">
      <div class="empty-msg">버튼을 눌러 번호를 생성해보세요!</div>
    </div>
  </div>

  <script data-cfasync="false">
    document.addEventListener('DOMContentLoaded', () => {
      const generateBtn = document.getElementById('generateBtn');
      const copyBtn = document.getElementById('copyBtn');
      const resultList = document.getElementById('resultList');
      const labels = ['A', 'B', 'C', 'D', 'E'];

      let currentGames = [];

      function createSingleGame() {
        const numbers = new Set();
        while (numbers.size < 6) {
          const randomNum = Math.floor(Math.random() * 45) + 1;
          numbers.add(randomNum);
        }
        return Array.from(numbers).sort((a, b) => a - b);
      }

      function getColorClass(num) {
        if (num <= 10) return 'color-1';
        if (num <= 20) return 'color-2';
        if (num <= 30) return 'color-3';
        if (num <= 40) return 'color-4';
        return 'color-5';
      }

      function renderGames() {
        resultList.innerHTML = '';
        currentGames = [];

        for (let i = 0; i < 5; i++) {
          const game = createSingleGame();
          currentGames.push(game);

          const row = document.createElement('div');
          row.className = 'lotto-row';

          const labelSpan = document.createElement('span');
          labelSpan.className = 'row-label';
          labelSpan.textContent = labels[i];

          const ballsDiv = document.createElement('div');
          ballsDiv.className = 'balls';

          game.forEach(num => {
            const ball = document.createElement('div');
            ball.className = `ball ${getColorClass(num)}`;
            ball.textContent = num;
            ballsDiv.appendChild(ball);
          });

          row.appendChild(labelSpan);
          row.appendChild(ballsDiv);
          resultList.appendChild(row);
        }

        copyBtn.style.display = 'block';
      }

      function copyGames() {
        if (currentGames.length === 0) return;

        const text = currentGames
          .map((game, idx) => `${labels[idx]}: ${game.join(', ')}`)
          .join('\n');

        navigator.clipboard.writeText(text).then(() => {
          const originalText = copyBtn.textContent;
          copyBtn.textContent = '복사 완료!';
          setTimeout(() => {
            copyBtn.textContent = originalText;
          }, 1500);
        });
      }

      generateBtn.addEventListener('click', renderGames);
      copyBtn.addEventListener('click', copyGames);
    });
  </script>

</body>
</html>
